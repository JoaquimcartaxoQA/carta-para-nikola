<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Race track border / speed circle -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#fbbf24" stroke-width="8" stroke-dasharray="24 16" opacity="0.6" />

  <!-- Big Bold Stylized Letter N -->
  <g filter="url(#glow)">
    <path d="M 120 370 L 120 142 L 185 142 L 327 305 L 327 142 L 392 142 L 392 370 L 327 370 L 185 207 L 185 370 Z"
          fill="url(#nGrad)"
          stroke="#78350f"
          stroke-width="10"
          stroke-linejoin="round" />
  </g>

  <!-- Speed lines -->
  <path d="M 60 210 L 130 210" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />
  <path d="M 40 256 L 120 256" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
  <path d="M 70 300 L 140 300" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8" />

  <!-- Cartoon Racing Car on Bottom -->
  <g transform="translate(140, 290)">
    <!-- Exhaust fire -->
    <path d="M -15 65 Q -40 60 -55 65 Q -40 70 -15 72 Z" fill="#f97316" />
    <path d="M -10 67 Q -25 64 -35 67 Q -25 70 -10 70 Z" fill="#facc15" />

    <!-- Car Body -->
    <!-- Spoiler -->
    <rect x="-8" y="24" width="10" height="26" fill="#18181b" rx="2" />
    <rect x="-14" y="20" width="30" height="8" fill="#ef4444" rx="3" stroke="#991b1b" stroke-width="2" />

    <!-- Chassis -->
    <path d="M 0 68 C 10 50, 40 45, 90 45 C 130 45, 170 52, 210 60 C 228 64, 235 72, 230 82 C 220 86, 20 86, 0 68 Z"
          fill="url(#carGrad)"
          stroke="#18181b"
          stroke-width="5" />

    <!-- Cockpit & Windshield -->
    <path d="M 70 45 C 80 20, 130 18, 155 45 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="4" opacity="0.9" />

    <!-- Nikola Helmet in car -->
    <circle cx="110" cy="35" r="16" fill="#18181b" stroke="#ef4444" stroke-width="3" />
    <path d="M 112 30 Q 124 33 124 38 Q 112 41 106 38 Z" fill="#fbbf24" />

    <!-- Racing Stripe & Number 1 -->
    <path d="M 10 62 L 205 62 L 195 72 L 5 72 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="150" cy="67" r="12" fill="#ffffff" stroke="#18181b" stroke-width="2" />
    <text x="150" y="72" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ef4444" text-anchor="middle">1</text>

    <!-- Wheels -->
    <!-- Back Wheel -->
    <circle cx="45" cy="80" r="22" fill="#18181b" stroke="#71717a" stroke-width="3" />
    <circle cx="45" cy="80" r="11" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <circle cx="45" cy="80" r="5" fill="#18181b" />

    <!-- Front Wheel -->
    <circle cx="185" cy="80" r="22" fill="#18181b" stroke="#71717a" stroke-width="3" />
    <circle cx="185" cy="80" r="11" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <circle cx="185" cy="80" r="5" fill="#18181b" />
  </g>

  <!-- Checkered flag flourish top right -->
  <g transform="translate(350, 70) rotate(15)">
    <rect x="0" y="0" width="16" height="16" fill="#ffffff" />
    <rect x="16" y="0" width="16" height="16" fill="#18181b" />
    <rect x="32" y="0" width="16" height="16" fill="#ffffff" />
    <rect x="0" y="16" width="16" height="16" fill="#18181b" />
    <rect x="16" y="16" width="16" height="16" fill="#ffffff" />
    <rect x="32" y="16" width="16" height="16" fill="#18181b" />
    <rect x="0" y="32" width="16" height="16" fill="#ffffff" />
    <rect x="16" y="32" width="16" height="16" fill="#18181b" />
    <rect x="32" y="32" width="16" height="16" fill="#ffffff" />
    <path d="M 0 0 L 0 70" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Stars for kids cartoon appeal -->
  <polygon points="100,100 106,115 122,116 110,126 114,141 100,131 86,141 90,126 78,116 94,115" fill="#fde047" />
  <polygon points="420,220 424,231 436,232 427,240 430,251 420,243 410,251 413,240 404,232 416,231" fill="#fde047" />
</svg>
